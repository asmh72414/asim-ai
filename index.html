
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عاصم AI | تحويل النص إلى صوت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#081326;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:22px 18px;
background:#101f39;
border-bottom:1px solid #b58b43;
text-align:center;
}

.logo{
font-size:27px;
font-weight:bold;
color:#e5bd68;
}

.logo span{color:white}

header p{
color:#aab7ca;
font-size:13px;
}

main{
max-width:650px;
margin:auto;
padding:20px;
}

.panel{
background:#12213b;
padding:18px;
border:1px solid #293c5b;
border-radius:16px;
margin-bottom:18px;
}

h2{
color:#e5bd68;
font-size:22px;
}

label{
display:block;
margin:15px 0 8px;
color:#e5bd68;
}

textarea,select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #43516b;
background:#091625;
color:white;
font-size:15px;
}

textarea{
height:155px;
resize:vertical;
}

button{
border:0;
border-radius:10px;
padding:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:12px;
}

.primary{
background:#d9ad59;
color:#101a2c;
}

.secondary{
background:#263957;
color:white;
}

.google{
background:white;
color:#222;
}

.info{
color:#aab7ca;
font-size:13px;
line-height:1.8;
}

#status{
color:#e5bd68;
margin-top:15px;
text-align:center;
}

.hidden{display:none}

footer{
text-align:center;
color:#8498b8;
padding:25px;
font-size:13px;
}
</style>
</head>

<body>

<header>
<div class="logo">عاصم <span>AI</span></div>
<p>حوّل النصوص إلى صوت بسهولة</p>
</header>

<main>

<section class="panel" id="loginPanel">
<h2>تسجيل الدخول</h2>
<p class="info">سجّل الدخول باستخدام حساب Google للوصول إلى الأداة.</p>
<button class="google" onclick="login()">الدخول باستخدام Google</button>
<p id="loginStatus" class="info"></p>
</section>

<section class="panel hidden" id="appPanel">
<h2>تحويل النص إلى صوت</h2>

<p class="info" id="userEmail"></p>

<label for="textInput">اكتب النص هنا</label>
<textarea id="textInput" placeholder="اكتب النص الذي تريد تحويله إلى صوت..."></textarea>

<label for="voiceSelect">اختر الصوت</label>
<select id="voiceSelect">
<option value="">جاري تحميل الأصوات...</option>
</select>

<label for="rate">سرعة الصوت</label>
<select id="rate">
<option value="0.8">بطيء</option>
<option value="1" selected>طبيعي</option>
<option value="1.2">سريع</option>
</select>

<button class="primary" onclick="speak()">تشغيل الصوت</button>
<button class="secondary" onclick="pauseSpeech()">إيقاف مؤقت</button>
<button class="secondary" onclick="resumeSpeech()">متابعة الصوت</button>
<button class="secondary" onclick="stopSpeech()">إيقاف الصوت</button>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>

<p class="info" id="status"></p>
<p class="info">ملاحظة: التشغيل الحالي يعتمد على الأصوات المتوفرة في جهازك، ولا ينشئ ملف MP3.</p>
</section>

</main>

<footer>
جميع الحقوق محفوظة © عاصم AI
</footer>

<script>
// إعداد Supabase

const SUPABASE_URL =
"https://lmrvmzbpalgdahvlvhxk.supabase.co";

// ضع مفتاح Publishable الخاص بك بين علامتي الاقتباس
const SUPABASE_KEY = "sb_publishable_Rxc1CU3B8Y66QmvkeRuXbg_OBNzh3KG";

let client = null;

if(SUPABASE_KEY.trim() !== "" && !SUPABASE_KEY.includes("ضع_مفتاح")){
client = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);
}

// إظهار واجهة التطبيق

function showApp(user){

document.getElementById("loginPanel").classList.add("hidden");
document.getElementById("appPanel").classList.remove("hidden");

document.getElementById("userEmail").textContent =
"الحساب: " + (user.email || "");

}

// إظهار واجهة تسجيل الدخول

function showLogin(){

document.getElementById("appPanel").classList.add("hidden");
document.getElementById("loginPanel").classList.remove("hidden");

}

// تسجيل الدخول

async function login(){

if(!client){
document.getElementById("loginStatus").textContent =
"تأكد من إضافة مفتاح Publishable الصحيح.";
return;
}

document.getElementById("loginStatus").textContent =
"جاري فتح تسجيل الدخول...";

const {error} = await client.auth.signInWithOAuth({
provider:"google",
options:{
redirectTo:"https://asmh72414.github.io/asim-ai/"
}
});

if(error){
document.getElementById("loginStatus").textContent =
"حدث خطأ أثناء تسجيل الدخول: " + error.message;
}

}

// تسجيل الخروج

async function logout(){

if(!client)return;

const {error} = await client.auth.signOut();

if(error){
document.getElementById("status").textContent =
"حدث خطأ أثناء تسجيل الخروج.";
return;
}

showLogin();

}

// فحص جلسة تسجيل الدخول

async function checkSession(){

if(!client)return;

const {data,error} = await client.auth.getSession();

if(error){
console.error("Session error:",error.message);
return;
}

if(data.session){
showApp(data.session.user);
}else{
showLogin();
}

}

// متابعة تغييرات تسجيل الدخول

if(client){

client.auth.onAuthStateChange((event,session)=>{

if(session){
showApp(session.user);

}else if(event === "SIGNED_OUT"){
showLogin();
}

});

checkSession();

}

// تحميل الأصوات

function loadVoices(){

const voices = speechSynthesis.getVoices();
const select = document.getElementById("voiceSelect");

select.innerHTML = "";

if(voices.length === 0){
select.innerHTML = '<option value="">لا توجد أصوات متاحة</option>';
return;
}

voices.forEach((voice,index)=>{

const option = document.createElement("option");

option.value = index;
option.textContent = voice.name + " - " + voice.lang;

select.appendChild(option);

});

}

loadVoices();

if("onvoiceschanged" in speechSynthesis){
speechSynthesis.onvoiceschanged = loadVoices;
}

// تشغيل الصوت

function speak(){

const text = document.getElementById("textInput").value.trim();

if(!text){
document.getElementById("status").textContent =
"اكتب النص أولاً.";
return;
}

if(!("speechSynthesis" in window)){
document.getElementById("status").textContent =
"المتصفح لا يدعم تشغيل الصوت.";
return;
}

speechSynthesis.cancel();

const utterance = new SpeechSynthesisUtterance(text);
const voices = speechSynthesis.getVoices();

const selected = document.getElementById("voiceSelect").value;

if(selected !== "" && voices[selected]){
utterance.voice = voices[selected];
}

utterance.rate = Number(document.getElementById("rate").value);
utterance.lang = "ar";

utterance.onstart = ()=>{
document.getElementById("status").textContent =
"جاري تشغيل الصوت...";
};

utterance.onend = ()=>{
document.getElementById("status").textContent =
"انتهى تشغيل الصوت.";
};

utterance.onerror = ()=>{
document.getElementById("status").textContent =
"حدث خطأ أثناء تشغيل الصوت.";
};

speechSynthesis.speak(utterance);

}

function pauseSpeech(){
speechSynthesis.pause();
}

function resumeSpeech(){
speechSynthesis.resume();
}

function stopSpeech(){
speechSynthesis.cancel();
document.getElementById("status").textContent =
"تم إيقاف الصوت.";
}

</script>

</body>
</html>
