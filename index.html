
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عاصم AI | تحويل النص إلى صوت</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#081326;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:22px 18px;
background:#101f39;
border-bottom:1px solid #b58b43;
text-align:center;
}
.logo{
font-size:27px;
font-weight:bold;
color:#e5bd68;
}
.logo span{color:white}
header p{color:#aab7ca;font-size:13px}
main{max-width:650px;margin:auto;padding:20px}
.panel{
background:#12213b;
padding:18px;
border:1px solid #293c5b;
border-radius:16px;
margin-bottom:18px;
}
h2{color:#e5bd68;font-size:22px}
label{
display:block;
margin:15px 0 8px;
color:#e5bd68;
}
textarea,select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #43516b;
background:#09162b;
color:white;
font-size:15px;
}
textarea{height:155px;resize:vertical}
button{
border:0;
border-radius:10px;
padding:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:12px;
}
.primary{background:#d9ad59;color:#101a2c}
.secondary{background:#263957;color:white}
.google{background:white;color:#222}
.info{color:#aab7ca;font-size:13px;line-height:1.8}
#status{
color:#e5bd68;
margin-top:15px;
text-align:center;
}
.hidden{display:none}
footer{
text-align:center;
color:#8498b8;
padding:25px;
font-size:13px;
}
</style>
</head>

<body>

<header>
<div class="logo">عاصم <span>AI</span></div>
<p>حوّل كلماتك إلى صوت</p>
</header>

<main>

<section id="loginPanel" class="panel">
<h2>مرحباً بك في عاصم AI</h2>
<p class="info">سجّل الدخول بحساب Google لاستخدام المنصة.</p>
<button class="google" onclick="login()">
تسجيل الدخول باستخدام Google
</button>
<div id="loginStatus" class="info"></div>
</section>

<section id="appPanel" class="hidden">

<div class="panel">
<p class="info">
تم تسجيل الدخول: <span id="userEmail"></span>
</p>
<button class="secondary" onclick="logout()">
تسجيل الخروج
</button>
</div>

<h2>صناعة الصوت بالذكاء الاصطناعي</h2>

<div class="panel">

<label for="text">اكتب النص</label>
<textarea id="text" placeholder="اكتب النص الذي تريد تحويله إلى صوت هنا..."></textarea>

<label for="language">لغة الصوت</label>
<select id="language" onchange="loadVoices()">
<option value="ar-SA">العربية الفصحى</option>
<option value="ar-IQ">اللهجة العراقية (إذا توفرت)</option>
</select>

<label for="voice">اختيار الصوت</label>
<select id="voice">
<option value="">الصوت الافتراضي</option>
</select>

<label for="speed">سرعة الكلام</label>
<select id="speed">
<option value="0.8">بطيء</option>
<option value="1" selected>طبيعي</option>
<option value="1.15">سريع قليلاً</option>
<option value="1.3">سريع</option>
</select>

<label for="pitch">نبرة الصوت</label>
<select id="pitch">
<option value="0.8">منخفضة</option>
<option value="1" selected>طبيعية</option>
<option value="1.2">مرتفعة قليلاً</option>
</select>

<button class="primary" onclick="speak()">
تشغيل الصوت
</button>

<button class="secondary" onclick="pauseSpeech()">
إيقاف مؤقت
</button>

<button class="secondary" onclick="stopSpeech()">
إيقاف الصوت
</button>

<p id="status"></p>
<p class="info">
ملاحظة: هذه النسخة تستخدم أصوات المتصفح مؤقتاً.
لا يتوفر تنزيل MP3 أو محرك SILMA في هذه النسخة.
</p>

</div>
</section>

</main>

<footer>
عاصم AI © جميع الحقوق محفوظة
</footer>

<script>

// إعداد Supabase
const SUPABASE_URL =
"https://lmrvmzbpalgdahvlvhxk.supabase.co";

const SUPABASE_KEY = "";

const client = supabase.createClient(
SUPABASE_URL
SUPABASE_KEY= "";sb_publishable_Rxc1CU3B8Y66QmvkeRuXbg_OBNzh3KG
);

// تسجيل الدخول
async function login(){
document.getElementById("loginStatus").textContent =
"جارٍ فتح تسجيل الدخول...";

const {error} = await client.auth.signInWithOAuth({
provider:"google",
options:{
redirectTo:"https://asmh72414.github.io/asim-ai/"
}
});

if(error){
document.getElementById("loginStatus").textContent =
"حدث خطأ: " + error.message;
}
}

// تسجيل الخروج
async function logout(){
await client.auth.signOut();
location.reload();
}

// عرض واجهة المستخدم
function showApp(user){
document.getElementById("loginPanel").classList.add("hidden");
document.getElementById("appPanel").classList.remove("hidden");
document.getElementById("userEmail").textContent =
user.email || "";
loadVoices();
}

// فحص تسجيل الدخول
async function checkSession(){
const {data} = await client.auth.getSession();

if(data.session){
showApp(data.session.user);
}
}

client.auth.onAuthStateChange((event,session)=>{
if(session){
showApp(session.user);
}else{
document.getElementById("loginPanel").classList.remove("hidden");
document.getElementById("appPanel").classList.add("hidden");
}
});

checkSession();

// تحميل الأصوات
function loadVoices(){
const voiceSelect = document.getElementById("voice");
const language = document.getElementById("language").value;
const voices = window.speechSynthesis.getVoices();

voiceSelect.innerHTML =
'<option value="">الصوت الافتراضي</option>';

voices
.filter(v=>v.lang.toLowerCase().startsWith("ar"))
.forEach((voice,index)=>{
const option = document.createElement("option");
option.value = voice.name;
option.textContent = voice.name + " - " + voice.lang;
voiceSelect.appendChild(option);
});
}

window.speechSynthesis.onvoiceschanged = loadVoices;

// تشغيل الصوت
function speak(){
const text = document.getElementById("text").value.trim();

if(!text){
document.getElementById("status").textContent =
"يرجى كتابة النص أولاً";
return;
}

window.speechSynthesis.cancel();

const utterance = new SpeechSynthesisUtterance(text);

const language = document.getElementById("language").value;
const voiceName = document.getElementById("voice").value;

utterance.lang = language;
utterance.rate = Number(document.getElementById("speed").value);
utterance.pitch = Number(document.getElementById("pitch").value);

const voices = window.speechSynthesis.getVoices();

if(voiceName){
const selected = voices.find(v=>v.name===voiceName);
if(selected) utterance.voice = selected;
}

utterance.onstart = ()=>{
document.getElementById("status").textContent =
"جارٍ تشغيل الصوت...";
};

utterance.onend = ()=>{
document.getElementById("status").textContent =
"انتهى تشغيل الصوت";
};

utterance.onerror = ()=>{
document.getElementById("status").textContent =
"تعذر تشغيل الصوت";
};

window.speechSynthesis.speak(utterance);
}

// إيقاف مؤقت
function pauseSpeech(){
window.speechSynthesis.pause();
}

// إيقاف الصوت
function stopSpeech(){
window.speechSynthesis.cancel();
document.getElementById("status").textContent =
"تم إيقاف الصوت";
}

</script>
</body>
</html>
